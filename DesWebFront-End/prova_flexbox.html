<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px;
            background-color: rgb(196, 186, 174);
        }

        #container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 500px;          /* ← exigência da atividade */
            height: 500px;         /* ← exigência da atividade */
            background-color: blanchedalmond;
            padding: 10px;
            gap: 10px;
            border: 2px solid #000;  /* borda para enfatizar a estrutura */
        }

        .item1 {
            background-color: rgb(227, 151, 97);
            flex: 0 0 70%; /* 70% da largura, não encolhe nem cresce */
            height: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item2 {
            background-color: rgb(102, 57, 3);
            /* caixa menor no topo, à direita */
            flex: 0 0 25%;
            height: 25%;
            margin-left: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item3 {
            background-color: rgb(63, 35, 1);
            /* caixa menor em baixo, à direita */
            flex: 0 0 25%;
            height: 25%;
            margin-left: auto; /* empurra para a direita na 2ª linha */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item1 img,
        .item2 img,
        .item3 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
    <title>Flexbox</title>
</head>

<body>
    <section id="container">
        <div class="item1"><img src="imagens/aurora_boreal.jpg" alt=""></div>
        <div class="item2"><img src="imagens/montains.jpg" alt=""></div>
        <div class="item3"><img src="imagens/folhas.jpg" alt=""></div>
    </section>

</body>

</html>
