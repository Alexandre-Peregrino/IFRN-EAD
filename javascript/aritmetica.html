<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Aritmética</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitulo {
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #2d3748;
            background: #f7fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: #ffffff;
        }
        .grupo { margin-bottom: 20px; }
        .linha-botoes {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .btn-primario { background: #667eea; color: #fff; }
        .btn-primario:hover { opacity: 0.9; }
        .btn-secundario { background: #edf2f7; color: #4a5568; }
        .btn-secundario:hover { background: #e2e8f0; }
        .mensagem {
            background: #ebf4ff;
            border-left: 4px solid #667eea;
            color: #2b6cb0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .termos-inseridos {
            background: #f0fff4;
            border-left: 4px solid #48bb78;
            color: #276749;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 16px;
            min-height: 20px;
        }
        .resultado {
            background: #faf5ff;
            border-left: 4px solid #805ad5;
            color: #553c9a;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            margin-top: 20px;
            text-align: center;
        }
        .escondido { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Calculadora de Médias</h1>
        <p class="subtitulo">Média aritmética</p>

        <div class="grupo">
            <label for="qt_ter">Quantidade de termos</label>
            <input id="qt_ter" type="number" min="1">
            <button class="btn-primario" type="button" onclick="definirQuantidade()" style="margin-top: 12px;">Definir</button>
        </div>

        <div id="areaTermos" class="escondido">
            <p id="mensagemTermo" class="mensagem"></p>
            <div class="grupo">
                <label for="termo">Digite o termo</label>
                <input id="termo" type="number">
            </div>
            <button class="btn-primario" type="button" onclick="inserirTermo()">Inserir</button>
            <p id="termosInseridos" class="termos-inseridos"></p>
        </div>

        <div class="linha-botoes">
            <button class="btn-secundario" type="button" onclick="reiniciar()">Reiniciar</button>
            <button class="btn-primario" type="button" onclick="calcular()">Calcular</button>
        </div>

        <p id="resultado" class="resultado"></p>
    </div>

    <script>
        // ============================================================
        // VARIÁVEIS GLOBAIS (o "estado" do programa)
        // ============================================================

        // Array que guarda todos os termos (ex: [7, 8, 9])
        let termos = [];

        // Quantidade de termos que o usuário definiu
        let quantidade = 0;

        // Quantos termos já foram inseridos até agora
        let contador = 0;

        // ============================================================
        // FUNÇÃO 1: define a quantidade de termos
        // ============================================================
        const definirQuantidade = () => {
            // Lê o que o usuário digitou e transforma em número
            quantidade = Number(document.getElementById("qt_ter").value);

            // Se não for número válido ou for menor/igual a zero, avisa e para
            if (isNaN(quantidade) || quantidade <= 0) {
                alert("Informe uma quantidade válida (maior que zero)");
                return;
            }

            // Zera a lista e o contador para começar do zero
            termos = [];
            contador = 0;

            // Limpa mensagens antigas
            document.getElementById("termosInseridos").textContent = "";
            document.getElementById("resultado").textContent = "";

            // Mostra a mensagem pedindo o primeiro termo
            document.getElementById("mensagemTermo").textContent =
                "Insira o termo 1 de " + quantidade;

            // Mostra a área dos termos e coloca o cursor no campo
            document.getElementById("areaTermos").classList.remove("escondido");
            document.getElementById("termo").focus();
        };

        // ============================================================
        // FUNÇÃO 2: insere um termo na lista
        // ============================================================
        const inserirTermo = () => {
            // Lê o termo digitado e transforma em número
            let valor = Number(document.getElementById("termo").value);

            // Se o campo está vazio ou não é número, avisa e para
            if (document.getElementById("termo").value === "" || isNaN(valor)) {
                alert("Digite um número válido");
                return;
            }

            // Guarda o termo na lista
            termos.push(valor);

            // Aumenta o contador de termos inseridos
            contador++;

            // Limpa o campo do termo para o próximo
            document.getElementById("termo").value = "";

            // Mostra os termos já inseridos
            document.getElementById("termosInseridos").textContent =
                "Termos inseridos: " + termos.join(", ");

            // Se ainda faltam termos, pede o próximo
            if (contador < quantidade) {
                document.getElementById("mensagemTermo").textContent =
                    "Insira o termo " + (contador + 1) + " de " + quantidade;
                document.getElementById("termo").focus();
            } else {
                // Se acabaram os termos, avisa que pode calcular
                document.getElementById("mensagemTermo").textContent =
                    "Todos os " + quantidade + " termos foram inseridos! Clique em Calcular.";
            }
        };

        // ============================================================
        // FUNÇÃO 3: calcula a média (recebe o array de notas)
        // ============================================================
        const calcularMedia = (notas) => {
            let soma = 0;
            for (let i = 0; i < notas.length; i++) {
                soma = soma + notas[i]; // acumula cada valor
            }
            let media = soma / notas.length; // divide pela quantidade
            return media; // devolve o resultado
        };

        // ============================================================
        // FUNÇÃO 4: mostra o resultado na página
        // ============================================================
        const exibirResultado = (texto) => {
            document.getElementById("resultado").textContent = texto;
        };

        // ============================================================
        // FUNÇÃO 5: função principal que organiza o cálculo
        // ============================================================
        const calcular = () => {
            // Verifica se todos os termos foram inseridos
            if (contador !== quantidade) {
                alert("Faltam termos: insira todos os " + quantidade + " antes de calcular.");
                return;
            }

            // Chama a função que calcula e guarda o resultado
            let media = calcularMedia(termos);

            // Chama a função que mostra o resultado na página
            exibirResultado("Média aritmética: " + media);
        };

        // ============================================================
        // FUNÇÃO 6: reinicia tudo
        // ============================================================
        const reiniciar = () => {
            // Zera as variáveis
            termos = [];
            quantidade = 0;
            contador = 0;

            // Limpa os campos
            document.getElementById("qt_ter").value = "";
            document.getElementById("termo").value = "";

            // Limpa as mensagens
            document.getElementById("mensagemTermo").textContent = "";
            document.getElementById("termosInseridos").textContent = "";
            document.getElementById("resultado").textContent = "";

            // Esconde a área dos termos
            document.getElementById("areaTermos").classList.add("escondido");
        };
    </script>
</body>
</html>
