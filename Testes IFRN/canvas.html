<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <h1>Experimentando o canvas</h1>
    <canvas id="canvas" width="1000" height="1000">

    </canvas>
    
</body>
<script>
    const canvas = document.getElementById("canvas");
    const ctx2d = canvas.getContext("2d");
    ctx2d.fillStyle = "blue";
    ctx2d.fillRect(100, 100, 200, 200);
    ctx2d.beginPath();
    ctx2d.arc(200, 450, 100, 0, Math.PI * 2);
    ctx2d.fillStyle = "red";
    ctx2d.fill();
    ctx2d.closePath();
   

</script>
</html>
